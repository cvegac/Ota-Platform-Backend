spring.application.name=embedded

server.error.include-stacktrace=never

# Actuator: health check del ALB. /actuator/health responde 200 sin auth.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

spring.sql.init.mode=always
spring.sql.init.platform=postgresql
# schema.sql (CREATE SCHEMA) debe correr ANTES que Hibernate -> no diferir.
spring.jpa.defer-datasource-initialization=false

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/app_db}
spring.datasource.username=${DB_USERNAME:admin}
spring.datasource.password=${DB_PASSWORD:secure_password}

# Hibernate ddl auto (create, create-drop, validate, update)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Security configs - la private key SIEMPRE por variable de entorno.
# El default de abajo es solo para arrancar en local; en AWS se inyecta JWT_PRIVATE_KEY.
security.jwt.key.private=${JWT_PRIVATE_KEY:local-dev-only-change-me}
security.jwt.key.generator=AOTH0JWT-BACKEND
security.jwt.key.span.hours=240

# AWS - credenciales via DefaultCredentialsProvider (IAM Instance Role en AWS,
# ~/.aws o variables de entorno en local). NO hardcodear access-key/secret-key aca.
aws.region=${AWS_REGION:us-east-2}

spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB
